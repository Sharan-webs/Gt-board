<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="kb-root">

  <div id="topbar">
    <button id="gtBtn" class="icon-btn gt-toggle" aria-label="GT mode"></button>
    <div id="gtPanel" class="gt-panel hidden">
      <button class="icon-btn gt-mini" data-panel="ai" aria-label="Call AI"></button>
      <button class="icon-btn gt-mini" data-panel="jw" aria-label="Japanese phrases"></button>
      <button class="icon-btn gt-mini" data-panel="jt" aria-label="Translate"></button>
      <button class="icon-btn gt-mini" data-panel="jte" aria-label="Translate romaji"></button>
      <button class="icon-btn gt-mini" id="clipboardBtn" aria-label="Clipboard"></button>
      <button class="icon-btn gt-mini gt-kill" id="killGt" aria-label="Exit GT mode"></button>
    </div>
    <div id="langLabel">English</div>
  </div>

  <div id="stage">
    <div id="floatingLayer"></div>
  </div>

  <div id="keysArea">
    <div id="view-letters" class="kb-view active"></div>
    <div id="view-numsym" class="kb-view"></div>
    <div id="view-symbols2" class="kb-view"></div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
