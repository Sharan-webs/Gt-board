<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="kb-root">

  <div id="topbar">
    <button id="gtBtn" class="icon-btn gt-toggle" aria-label="GT tools" title="GT tools">
      <svg viewBox="0 0 24 24" class="icon icon-gt"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
    </button>

    <div id="gtPanel" class="gt-panel hidden">
      <button class="icon-btn gt-mini" data-panel="ai" aria-label="Ask AI" title="Ask AI">
        <svg viewBox="0 0 24 24" class="icon icon-ai">
          <path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/>
        </svg>
      </button>
      <button class="icon-btn gt-mini" data-panel="jw" aria-label="Japanese phrases" title="Japanese phrases">
        <svg viewBox="0 0 24 24" class="icon icon-jw">
          <rect x="4" y="5" width="16" height="10" rx="2"/>
          <path d="M8 15l-2 4v-4"/>
        </svg>
      </button>
      <button class="icon-btn gt-mini" data-panel="jt" aria-label="Translate to Japanese" title="Translate to Japanese">
        <svg viewBox="0 0 24 24" class="icon icon-jt">
          <path d="M4 12a8 8 0 0 1 13-6.1M20 12a8 8 0 0 1-13 6.1"/>
          <path d="M17 3v3h-3M7 21v-3h3"/>
        </svg>
      </button>
      <button class="icon-btn gt-mini" data-panel="jte" aria-label="Translate to romaji" title="Translate to romaji">
        <svg viewBox="0 0 24 24" class="icon icon-jte">
          <path d="M4 11a7 7 0 0 1 11.5-5.4M19 11a7 7 0 0 1-11.5 5.4"/>
          <path d="M15.5 3v3h-3M8.5 19v-3h3"/>
          <path class="icon-jte-dash" d="M4 20.5h14"/>
        </svg>
      </button>
      <button class="icon-btn gt-mini" data-panel="clipboard" aria-label="Clipboard" title="Clipboard">
        <svg viewBox="0 0 24 24" class="icon icon-clip">
          <rect x="6" y="4" width="12" height="17" rx="2"/>
          <rect x="9" y="2" width="6" height="4" rx="1"/>
          <path class="icon-clip-check" d="M9 13l2 2 4-4"/>
        </svg>
      </button>
      <button class="icon-btn gt-mini" id="themeBtn" aria-label="Theme" title="Theme">
        <svg viewBox="0 0 24 24" class="icon icon-theme">
          <rect x="3" y="5" width="18" height="14" rx="2"/>
          <circle cx="8.5" cy="10" r="1.6"/>
          <path d="M3 16l5-4 4 3 3-2 6 5"/>
        </svg>
      </button>
      <button class="icon-btn gt-mini" id="settingsBtn" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" class="icon icon-settings">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.5-2-3.5-2.4 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.3 2.5a7.6 7.6 0 0 0-1.7 1l-2.4-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a7.6 7.6 0 0 0 1.7 1L11 21h4l.3-2.5a7.6 7.6 0 0 0 1.7-1l2.4 1 2-3.5-2-1.5Z"/>
        </svg>
      </button>
      <button class="icon-btn gt-mini gt-kill" id="killGt" aria-label="Close GT tools" title="Close GT tools">
        <svg viewBox="0 0 24 24" class="icon icon-kill">
          <circle cx="12" cy="12" r="9"/>
          <path d="M9 9l6 6M15 9l-6 6"/>
        </svg>
      </button>
    </div>

    <div id="langLabel">English</div>
  </div>

  <div id="floatingArea"></div>

  <div id="views">
    <div id="view-letters" class="kb-view active"></div>
    <div id="view-numsym" class="kb-view"></div>
    <div id="view-symbols2" class="kb-view"></div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
